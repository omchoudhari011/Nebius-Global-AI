name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest
      - name: Evals (recall, latency, permission-block rate, security)
        run: python eval/run_all.py
      - run: cat eval/results.md

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Web export
        run: npx expo export --platform web --output-dir dist

  docker:
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t custodian:ci .
      - name: Smoke test the production image
        run: |
          docker run -d --name custodian -p 8000:8000 \
            -e CUSTODIAN_PASSCODE=ci-passcode-1234 \
            -e APP_SECRET_KEY="$(python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            -e SESSION_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            --read-only --tmpfs /tmp --cap-drop ALL custodian:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl -sf http://localhost:8000/ | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/permissions)" = 401
          docker exec custodian python -m app.cli sandbox-selftest
      - if: failure()
        run: docker logs custodian
